# Committed fallback for the secrets Gradle plugin (docs/SETUP.md). A real key goes in
# secrets.properties, which is git-ignored - this file exists purely so a keyless clone (and CI)
# still resolves the MAPS_API_KEY manifest placeholder and BuildConfig field and builds.
#
# A single space, not an empty string: secrets-gradle-plugin 2.0.1's default-value injection
# (Extensions.kt's String.addParenthesisIfNeeded()) emits an unquoted, unparseable BuildConfig
# field for a value that is empty *after* its surrounding-quote strip - "" breaks the build,
# " " does not. RoutesApiRepository already treats a blank key as absent via isBlank(), so this
# reads as keyless everywhere that matters.
MAPS_API_KEY=" "
